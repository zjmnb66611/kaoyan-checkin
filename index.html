<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>考研打卡 - 每日坚持，一战成硕</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          warm: {
            50: '#fefce8',
            100: '#fef9c3',
            200: '#fef08a',
            300: '#fde047',
            400: '#facc15',
            500: '#eab308',
          }
        }
      }
    }
  }
</script>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">

<style>
  /* ═══ CSS 变量：暖色调色板 ═══ */
  :root {
    --color-primary: #EA8C3C;
    --color-primary-light: #F5CBA7;
    --color-primary-dark: #C0681A;
    --color-bg: #FFF9F2;
    --color-bg-card: #FFFFFF;
    --color-text: #292524;
    --color-text-secondary: #78716C;
    --color-text-muted: #A8A29E;
    --color-border: #F0E8DF;
    --color-success: #6ABC6A;
    --color-danger: #E07B5A;
    --color-info: #5A9FD6;
    --color-rest: #7BA5D6;
    --color-leave: #E8948C;
    --color-warning: #F0B050;
    --radius-sm: 0.5rem;
    --radius-md: 0.75rem;
    --radius-lg: 1rem;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background-color: var(--color-bg);
    color: var(--color-text);
    margin: 0;
    padding: 0;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ═══ 移动端布局（默认） ═══ */
  .app-wrapper {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
  }

  .main-content {
    flex: 1;
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    padding-bottom: 70px; /* 给底部导航留空间 */
  }

  /* ═══ 移动端底部导航 ═══ */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    background: var(--color-bg-card);
    border-top: 1px solid var(--color-border);
    display: flex;
    flex-direction: row;
    justify-content: space-around;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index: 100;
    box-shadow: 0 -1px 8px rgba(0,0,0,0.03);
    overflow-x: hidden;
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 4px 6px;
    color: var(--color-text-muted);
    cursor: pointer;
    transition: all 0.2s ease;
    border-radius: var(--radius-md);
    font-size: 10px;
    text-decoration: none;
    min-width: 48px;
    flex: 0 1 auto;
  }

  .nav-item i { font-size: 18px; transition: transform 0.2s ease; }
  .nav-item.active { color: var(--color-primary); font-weight: 600; }
  .nav-item.active i { transform: scale(1.1); }
  .nav-item:active { transform: scale(0.95); }

  /* ═══ 悬浮新建按钮 ═══ */
  .fab {
    position: fixed;
    bottom: 80px;
    right: 16px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
    color: white;
    border: none;
    box-shadow: 0 4px 16px rgba(234, 140, 60, 0.35);
    cursor: pointer;
    z-index: 99;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    transition: all 0.25s ease;
  }

  .fab:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(234, 140, 60, 0.45); }
  .fab:active { transform: scale(0.92); }

  /* ═══ Toast 容器 ═══ */
  #toast-container { pointer-events: none; }

  /* ═══ 动画关键帧 ═══ */
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes modalSlideIn {
    from { opacity: 0; transform: translateY(30px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes checkBounce {
    0% { transform: scale(0); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  @keyframes taskComplete {
    0% { transform: scale(1); background: white; }
    30% { transform: scale(1.02); background: #f0fdf4; }
    100% { transform: scale(1); background: white; }
  }

  .task-complete-anim {
    animation: taskComplete 0.5s ease;
  }

  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .page-container {
    animation: fadeIn 0.25s ease;
  }

  /* ═══ Toggle 开关 ═══ */
  .toggle-input:checked ~ .toggle-bg { background-color: #f59e0b !important; }
  .toggle-input:checked ~ .toggle-dot { transform: translateX(20px); }

  /* ═══ 日历单元格 ═══ */
  .calendar-cell:hover { transform: scale(1.05); }
  .calendar-cell:active { transform: scale(0.95); }

  /* ═══ 任务卡片打勾动画 ═══ */
  .task-checkbox {
    position: relative;
    overflow: hidden;
  }

  .task-checkbox::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: rgba(16, 185, 129, 0.15);
    transform: scale(0);
    transition: transform 0.3s ease;
  }

  .task-checkbox:active::after {
    transform: scale(1.5);
  }

  /* ═══ 响应式 PC 端 ═══ */
  @media (min-width: 768px) {
    body {
      display: flex;
      justify-content: center;
    }

    .app-wrapper {
      display: flex;
      flex-direction: row;
      max-width: 960px;
      width: 100%;
      min-height: 100vh;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      height: 100vh;
      padding-bottom: 0;
      max-width: none;
    }

    .bottom-nav {
      position: sticky;
      top: 0;
      left: 0;
      width: 200px;
      flex-direction: column;
      justify-content: flex-start;
      height: 100vh;
      padding: 24px 12px;
      border-top: none;
      border-right: 1px solid var(--color-border);
      box-shadow: none;
      gap: 4px;
    }

    .nav-item {
      flex-direction: row;
      gap: 10px;
      padding: 10px 16px;
      font-size: 14px;
      justify-content: flex-start;
      min-width: auto;
    }

    .nav-item i { font-size: 18px; width: 22px; text-align: center; }

    .fab {
      bottom: 28px;
      right: calc(50% - 460px);
    }
  }

  @media (min-width: 1024px) {
    .app-wrapper {
      max-width: 1100px;
    }
    .bottom-nav { width: 220px; }
    .fab {
      right: calc(50% - 530px);
    }
  }

  /* 滚动条美化 */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }

  /* 任务内容文本折叠 */
  .task-content {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    cursor: pointer;
  }

  .task-content.expanded {
    -webkit-line-clamp: unset;
  }
</style>
</head>
<body>

<div class="app-wrapper">
  <!-- ═══ PC 侧边导航 / 移动端底部导航 ═══ -->
  <nav class="bottom-nav" id="main-nav">
    <a class="nav-item active" href="#/home" data-page="home">
      <i class="fa fa-home"></i>
      <span>首页</span>
    </a>
    <a class="nav-item" href="#/calendar" data-page="calendar">
      <i class="fa fa-calendar"></i>
      <span>日历</span>
    </a>
    <a class="nav-item" href="#/review" data-page="review">
      <i class="fa fa-bar-chart"></i>
      <span>复盘</span>
    </a>
    <a class="nav-item" href="#/settings" data-page="settings">
      <i class="fa fa-cog"></i>
      <span>设置</span>
    </a>
  </nav>

  <!-- ═══ 主内容区域 ═══ -->
  <div class="main-content relative">
    <!-- 首页 -->
    <div class="page-container" id="page-home" style="display:none;"></div>

    <!-- 日历页 -->
    <div class="page-container" id="page-calendar" style="display:none;"></div>

    <!-- 复盘页 -->
    <div class="page-container" id="page-review" style="display:none;"></div>

    <!-- 设置页 -->
    <div class="page-container" id="page-settings" style="display:none;"></div>
  </div>
</div>

<!-- 悬浮新建按钮 -->
<button class="fab" id="fab-add" title="新建任务">
  <i class="fa fa-plus"></i>
</button>

<!-- Toast 容器 -->
<div id="toast-container"></div>

<!-- ═══ JS 模块（按依赖顺序加载） ═══ -->
<script src="js/utils/date.js"></script>
<script src="js/utils/dom.js"></script>
<script src="js/utils/format.js"></script>
<script src="js/utils/validate.js"></script>
<script src="js/state.js"></script>
<script src="js/modules/subjects.js"></script>
<script src="js/modules/task.js"></script>
<script src="js/modules/rest.js"></script>
<script src="js/modules/checkin.js"></script>
<script src="js/modules/review.js"></script>
<script src="js/components/modal.js"></script>
<script src="js/app.js"></script>

<script>
/* ═══ 全局事件绑定（在 App.init 之后执行） ═══ */

// 悬浮按钮 - 新建任务
document.getElementById('fab-add').addEventListener('click', () => {
  Modal.show({
    title: '📝 新建任务',
    bodyHTML: `
      <div class="space-y-3 text-left">
        <div>
          <label class="text-xs text-stone-500 block mb-1">科目</label>
          <select id="new-task-subject" class="w-full px-3 py-2 text-sm border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-300">
            <option value="">选择科目</option>
            ${SubjectModule.getAll().map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
          </select>
        </div>
        <div>
          <label class="text-xs text-stone-500 block mb-1">日期</label>
          <input type="date" id="new-task-date" value="${DateUtils.today()}" class="w-full px-3 py-2 text-sm border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-300">
        </div>
        <div>
          <label class="text-xs text-stone-500 block mb-1">任务内容</label>
          <textarea id="new-task-content" rows="3" placeholder="今天要做什么？" class="w-full px-3 py-2 text-sm border border-stone-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-300 resize-none"></textarea>
        </div>
      </div>
    `,
    confirmText: '添加',
    onConfirm: () => {
      const subjectId = document.getElementById('new-task-subject').value;
      const date = document.getElementById('new-task-date').value;
      const content = document.getElementById('new-task-content').value;
      const result = TaskModule.addTask({ subjectId, scheduledDate: date, content });
      if (result.ok) {
        Toast.success('任务已添加');
      } else {
        Toast.error(result.msg);
      }
    }
  });
});

// 全局任务交互委托
document.addEventListener('click', e => {
  // 勾选任务
  const checkbox = e.target.closest('.task-checkbox');
  if (checkbox) {
    const taskId = checkbox.dataset.taskId;
    const task = TaskModule.getTaskById(taskId);
    if (task) {
      CheckinModule.toggleCheckin(taskId);
      // 添加动画
      const card = checkbox.closest('.task-card');
      if (card) {
        card.classList.add('task-complete-anim');
        setTimeout(() => card.classList.remove('task-complete-anim'), 500);
      }
    }
  }

  // 任务更多操作
  const moreBtn = e.target.closest('.task-more');
  if (moreBtn) {
    const taskId = moreBtn.dataset.taskId;
    const task = TaskModule.getTaskById(taskId);
    if (!task) return;

    // 创建快捷菜单
    const menu = DOM.create('div', {
      className: 'fixed bg-white rounded-xl shadow-lg border border-stone-100 py-2 z-[999] min-w-[140px]',
      style: { top: e.clientY + 'px', left: Math.min(e.clientX, window.innerWidth - 160) + 'px', animation: 'modalSlideIn 0.2s ease' }
    }, [
      createMenuItem('✏️ 编辑', () => {
        const newContent = prompt('修改任务内容：', task.content);
        if (newContent && newContent.trim()) {
          TaskModule.updateTask(taskId, { content: newContent.trim() });
          Toast.success('任务已更新');
        }
      }),
      createMenuItem('📅 迁移日期', () => {
        const newDate = prompt('请输入目标日期 (YYYY-MM-DD)：', DateUtils.today());
        if (newDate && Validate.isValidDate(newDate)) {
          TaskModule.updateTask(taskId, { scheduledDate: newDate });
          Toast.success('任务已迁移');
        }
      }),
      createMenuItem('📝 打卡备注', () => {
        const note = prompt('请输入打卡备注：', task.checkinNote || '');
        if (note !== null) {
          CheckinModule.addCheckinNote(taskId, note);
          Toast.success('备注已保存');
        }
      }),
      task.status === 'pending' && task.scheduledDate < DateUtils.today()
        ? createMenuItem('🔄 补卡', () => {
            const result = CheckinModule.backfillCheckin(taskId);
            if (result.ok) Toast.success('补卡成功');
            else Toast.warning(result.msg);
          })
        : null,
      createMenuItem('🗑️ 删除', () => {
        TaskModule.deleteTask(taskId);
        Toast.success('任务已删除');
      }, 'text-orange-500')
    ].filter(Boolean));

    document.body.appendChild(menu);
    setTimeout(() => {
      document.addEventListener('click', function closeMenu() {
        DOM.remove(menu);
        document.removeEventListener('click', closeMenu);
      }, { once: true });
    }, 10);
    e.stopPropagation();
  }

  // 展开/折叠任务文本
  const taskContent = e.target.closest('.task-content');
  if (taskContent && !e.target.closest('.task-checkbox') && !e.target.closest('.task-more')) {
    taskContent.classList.toggle('expanded');
  }
});

// 长按任务（移动端）
let longPressTimer;
document.addEventListener('touchstart', e => {
  const card = e.target.closest('.task-card');
  if (!card) return;
  longPressTimer = setTimeout(() => {
    const taskId = card.dataset.taskId;
    const task = TaskModule.getTaskById(taskId);
    if (!task) return;

    // 长按快捷菜单
    const rect = card.getBoundingClientRect();
    const menu = DOM.create('div', {
      className: 'fixed bg-white rounded-xl shadow-lg border border-stone-100 py-2 z-[999] min-w-[150px]',
      style: {
        top: Math.min(rect.bottom, window.innerHeight - 220) + 'px',
        left: Math.min(rect.left, window.innerWidth - 170) + 'px',
        animation: 'modalSlideIn 0.2s ease'
      }
    }, [
      createMenuItem('✏️ 编辑内容', () => {
        const newContent = prompt('修改任务内容：', task.content);
        if (newContent && newContent.trim()) TaskModule.updateTask(taskId, { content: newContent.trim() });
      }),
      createMenuItem('📅 迁移日期', () => {
        const newDate = prompt('目标日期 (YYYY-MM-DD)：', DateUtils.today());
        if (newDate && Validate.isValidDate(newDate)) TaskModule.updateTask(taskId, { scheduledDate: newDate });
      }),
      createMenuItem('🗑️ 删除任务', () => TaskModule.deleteTask(taskId), 'text-orange-500'),
    ]);

    document.body.appendChild(menu);
    setTimeout(() => {
      document.addEventListener('click', function closeMenu() {
        DOM.remove(menu);
        document.removeEventListener('click', closeMenu);
      }, { once: true });
    }, 10);
  }, 500);
}, { passive: true });

document.addEventListener('touchend', () => clearTimeout(longPressTimer));
document.addEventListener('touchmove', () => clearTimeout(longPressTimer));

function createMenuItem(label, onClick, extraClass = '') {
  return DOM.create('button', {
    className: `w-full text-left px-4 py-2.5 text-sm text-stone-700 hover:bg-stone-50 transition-all flex items-center gap-2 ${extraClass}`,
    innerHTML: label,
    onClick
  });
}
</script>

</body>
</html>
