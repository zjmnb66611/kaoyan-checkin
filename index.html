<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">

<style>
  /* ═══ CSS 变量：暖色调色板 ═══ */
  :root {
    --color-primary: #EA8C3C;
    --color-primary-light: #F5CBA7;
    --color-primary-dark: #C0681A;
    --color-bg: #FFF9F2;
    --color-bg-card: #FFFFFF;
    --color-text: #292524;
    --color-text-secondary: #78716C;
    --color-text-muted: #A8A29E;
    --color-border: #F0E8DF;
    --color-success: #6ABC6A;
    --color-danger: #E07B5A;
    --color-info: #5A9FD6;
    --color-rest: #7BA5D6;
    --color-leave: #E8948C;
    --color-warning: #F0B050;
    --radius-sm: 0.5rem;
    --radius-md: 0.75rem;
    --radius-lg: 1rem;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background-color: var(--color-bg);
    color: var(--color-text);
    margin: 0;
    padding: 0;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ═══ 移动端布局（默认） ═══ */
  .app-wrapper {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh; /* 动态视口高度，适配移动端浏览器地址栏 */
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
  }

  .main-content {
    flex: 1;
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    padding-bottom: 70px; /* 给底部导航留空间 */
  }

  /* ═══ 移动端底部导航 ═══ */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    width: 100%;
    max-width: 100vw;
    background: var(--color-bg-card);
    border-top: 1px solid var(--color-border);
    display: flex;
    flex-direction: row;
    justify-content: space-around;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index: 100;
    box-shadow: 0 -1px 8px rgba(0,0,0,0.03);
    overflow-x: hidden;
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 4px 2px;
    color: var(--color-text-muted);
    cursor: pointer;
    transition: transform 0.15s ease;
    border-radius: var(--radius-md);
    font-size: 10px;
    text-decoration: none;
    min-width: 0;
    flex: 1 1 auto;
    max-width: 25%;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .nav-item i { font-size: 18px; transition: transform 0.15s ease; }
  .nav-item.active { color: var(--color-primary); font-weight: 600; }
  .nav-item.active i { transform: scale(1.1); }
  .nav-item:active { transform: scale(0.92); }
  .nav-item.nav-touching { transform: scale(0.92); }

  /* ═══ Toast 容器 ═══ */
  #toast-container {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }

  /* ═══ 动画关键帧 ═══ */
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes modalSlideIn {
    from { opacity: 0; transform: translateY(30px) scale(0.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  @keyframes checkBounce {
    0% { transform: scale(0); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }

  @keyframes taskComplete {
    0% { transform: scale(1); background: white; }
    30% { transform: scale(1.02); background: #f0fdf4; }
    100% { transform: scale(1); background: white; }
  }

  .task-complete-anim {
    animation: taskComplete 0.5s ease;
  }

  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .page-container {
    animation: fadeIn 0.25s ease;
  }

  /* ═══ Toggle 开关 ═══ */
  .toggle-input:checked ~ .toggle-bg { background-color: #f59e0b !important; }
  .toggle-input:checked ~ .toggle-dot { transform: translateX(20px); }

  /* ═══ 日历单元格 ═══ */
  .calendar-cell:hover { transform: scale(1.05); }
  .calendar-cell:active { transform: scale(0.95); }

  /* ═══ 任务卡片打勾动画 ═══ */
  .task-checkbox {
    position: relative;
    overflow: hidden;
  }

  .task-checkbox::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: rgba(16, 185, 129, 0.15);
    transform: scale(0);
    transition: transform 0.3s ease;
  }

  .task-checkbox:active::after {
    transform: scale(1.5);
  }

  /* ═══ 响应式 PC 端 ═══ */
  @media (min-width: 768px) {
    body {
      display: flex;
      justify-content: center;
    }

    .app-wrapper {
      display: flex;
      flex-direction: row;
      max-width: 960px;
      width: 100%;
      min-height: 100vh;
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      height: 100vh;
      padding-bottom: 0;
      max-width: none;
    }

    .bottom-nav {
      position: sticky;
      top: 0;
      left: 0;
      width: 200px;
      flex-direction: column;
      justify-content: flex-start;
      height: 100vh;
      padding: 24px 12px;
      border-top: none;
      border-right: 1px solid var(--color-border);
      box-shadow: none;
      gap: 4px;
    }

    .nav-item {
      flex-direction: row;
      gap: 10px;
      padding: 10px 16px;
      font-size: 14px;
      justify-content: flex-start;
      min-width: auto;
      flex: 0 0 auto;
      max-width: none;
    }

    .nav-item i { font-size: 18px; width: 22px; text-align: center; }
  }

  @media (min-width: 1024px) {
    .app-wrapper {
      max-width: 1100px;
    }
    .bottom-nav { width: 220px; }
  }

  /* 滚动条美化 */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }

  /* ═══ 移动端特有规则（< 768px） ═══ */
  @media (max-width: 767px) {
    /* Toast 不超出屏幕 */
    #toast-container {
      left: 8px !important;
      right: 8px !important;
      top: 8px !important;
      transform: none !important;
      max-width: calc(100vw - 16px);
      width: calc(100vw - 16px);
    }

    .toast-item {
      max-width: 100%;
      text-align: center;
    }

    /* Modal 弹窗不超出屏幕 */
    #modal-overlay > div {
      max-width: 92vw !important;
      width: 92vw !important;
    }

    /* 复盘页科目标签宽度 */
    .review-subject-label {
      width: 3.5rem !important;
      min-width: 3.5rem !important;
      max-width: 3.5rem !important;
    }

    /* 防止任何元素超出屏幕 */
    img, svg, video, canvas, table, pre, code {
      max-width: 100%;
    }
  }

  /* 任务内容文本折叠 */
  .task-content {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    cursor: pointer;
  }

  .task-content.expanded {
    -webkit-line-clamp: unset;
  }
</style>
</head>
<body>

<!-- Toast 容器 -->

<!-- ═══ JS 模块（按依赖顺序加载） ═══ -->

<script>
/* ═══ 导航栏即时点击反馈（移动端优化） ═══ */
(function() {
  const navItems = document.querySelectorAll('#main-nav .nav-item');
  let _navLocked = false;
  let _currentNavPage = 'home';

  window._navGetCurrentPage = () => _currentNavPage;
  window._navSetCurrentPage = (page) => { _currentNavPage = page; };

  navItems.forEach(item => {
    // 抽取导航逻辑为复用函数
    function doNavigate() {
      const targetPage = item.dataset.page;
      if (targetPage === _currentNavPage) return;
      if (_navLocked) return;
      _navLocked = true;
      setTimeout(() => { _navLocked = false; }, 300);

      _currentNavPage = targetPage;

      // 1. 即时切换 active
      navItems.forEach(el => el.classList.remove('active'));
      item.classList.add('active');

      // 2. 更新 hash（静默）
      const newHash = '#/' + targetPage;
      if (location.hash !== newHash) {
        history.replaceState(null, '', newHash);
      }

      // 3. 直接渲染目标页面 — 不使用 setTimeout，确保渲染单次完成
      try {
        App.handleRouteDirect(targetPage);
      } catch (e) {
        console.error('路由切换失败:', e);
        _navLocked = false; // 异常时释放锁
      }
    }

    // 触屏：用 touchend 消除 300ms 延迟，同时用标志位阻止重复 click
    let _touchHandled = false;

    item.addEventListener('touchstart', function(e) {
      _touchHandled = false;
      this.classList.add('nav-touching');
    }, { passive: true });

    item.addEventListener('touchend', function(e) {
      this.classList.remove('nav-touching');
      if (_touchHandled) return;
      _touchHandled = true;
      e.preventDefault();
      setTimeout(() => { _touchHandled = false; }, 500);
      doNavigate();
      // 触觉反馈
      if (navigator.vibrate) navigator.vibrate(8);
    });

    // PC 端 click 兜底；移动端被 _touchHandled 拦截后不会重复执行
    item.addEventListener('click', function(e) {
      if (_touchHandled) { _touchHandled = false; return; }
      e.preventDefault();
      doNavigate();
    });
  });
})();

/* ═══ 全局任务交互委托 ═══ */
// 全局任务交互委托
document.addEventListener('click', e => {
  // 批量选择复选框
  const batchCheck = e.target.closest('.batch-check');
  if (batchCheck) {
    const toolbar = document.getElementById('batch-toolbar');
    if (!toolbar || toolbar.classList.contains('hidden')) return; // 批量模式未激活
    const taskId = batchCheck.dataset.taskId;
    if (batchSelected.has(taskId)) {
      batchSelected.delete(taskId);
      batchCheck.classList.remove('bg-amber-400', 'border-amber-400');
      const icon = batchCheck.querySelector('i');
      if (icon) icon.classList.add('hidden');
      const card = batchCheck.closest('.task-card');
      if (card) card.classList.remove('ring-2', 'ring-amber-300');
    } else {
      batchSelected.add(taskId);
      batchCheck.classList.add('bg-amber-400', 'border-amber-400');
      const icon = batchCheck.querySelector('i');
      if (icon) icon.classList.remove('hidden');
      const card = batchCheck.closest('.task-card');
      if (card) card.classList.add('ring-2', 'ring-amber-300');
    }
    const countEl = document.getElementById('batch-count');
    if (countEl) countEl.textContent = `已选 ${batchSelected.size} 项`;
    return;
  }

  // 勾选任务（非批量模式下）
  const checkbox = e.target.closest('.task-checkbox');
  if (checkbox) {
    // 如果批量工具栏激活，拦截勾选
    const toolbar = document.getElementById('batch-toolbar');
    if (toolbar && !toolbar.classList.contains('hidden')) return;
    const taskId = checkbox.dataset.taskId;
    const task = TaskModule.getTaskById(taskId);
    if (task) {
      CheckinModule.toggleCheckin(taskId);
      // 添加动画
      const card = checkbox.closest('.task-card');
      if (card) {
        card.classList.add('task-complete-anim');
        setTimeout(() => card.classList.remove('task-complete-anim'), 500);
      }
    }
  }

  // 任务更多操作
  const moreBtn = e.target.closest('.task-more');
  if (moreBtn) {
    const taskId = moreBtn.dataset.taskId;
    const task = TaskModule.getTaskById(taskId);
    if (!task) return;

    // 创建快捷菜单
    const menu = DOM.create('div', {
      className: 'fixed bg-white rounded-xl shadow-lg border border-stone-100 py-2 z-[999] min-w-[140px]',
      style: { top: e.clientY + 'px', left: Math.min(e.clientX, window.innerWidth - 160) + 'px', animation: 'modalSlideIn 0.2s ease' }
    }, [
      createMenuItem('✏️ 编辑', () => {
        const newContent = prompt('修改任务内容：', task.content);
        if (newContent && newContent.trim()) {
          TaskModule.updateTask(taskId, { content: newContent.trim() });
          Toast.success('任务已更新');
        }
      }),
      createMenuItem('📅 迁移日期', () => {
        const newDate = prompt('请输入目标日期 (YYYY-MM-DD)：', DateUtils.today());
        if (newDate && Validate.isValidDate(newDate)) {
          TaskModule.updateTask(taskId, { scheduledDate: newDate });
          Toast.success('任务已迁移');
        }
      }),
      createMenuItem('📝 打卡备注', () => {
        const note = prompt('请输入打卡备注：', task.checkinNote || '');
        if (note !== null) {
          CheckinModule.addCheckinNote(taskId, note);
          Toast.success('备注已保存');
        }
      }),
      task.status === 'pending' && task.scheduledDate < DateUtils.today()
        ? createMenuItem('🔄 补卡', () => {
            const result = CheckinModule.backfillCheckin(taskId);
            if (result.ok) Toast.success('补卡成功');
            else Toast.warning(result.msg);
          })
        : null,
      createMenuItem('🗑️ 删除', () => {
        TaskModule.deleteTask(taskId);
        Toast.success('任务已删除');
      }, 'text-orange-500')
    ].filter(Boolean));

    document.body.appendChild(menu);
    setTimeout(() => {
      document.addEventListener('click', function closeMenu() {
        DOM.remove(menu);
        document.removeEventListener('click', closeMenu);
      }, { once: true });
    }, 10);
    e.stopPropagation();
  }

  // 展开/折叠任务文本
  const taskContent = e.target.closest('.task-content');
  if (taskContent && !e.target.closest('.task-checkbox') && !e.target.closest('.task-more')) {
    taskContent.classList.toggle('expanded');
  }
});

// 长按任务（移动端）
let longPressTimer;
document.addEventListener('touchstart', e => {
  const card = e.target.closest('.task-card');
  if (!card) return;
  longPressTimer = setTimeout(() => {
    const taskId = card.dataset.taskId;
    const task = TaskModule.getTaskById(taskId);
    if (!task) return;

    // 长按快捷菜单
    const rect = card.getBoundingClientRect();
    const menu = DOM.create('div', {
      className: 'fixed bg-white rounded-xl shadow-lg border border-stone-100 py-2 z-[999] min-w-[150px]',
      style: {
        top: Math.min(rect.bottom, window.innerHeight - 220) + 'px',
        left: Math.min(rect.left, window.innerWidth - 170) + 'px',
        animation: 'modalSlideIn 0.2s ease'
      }
    }, [
      createMenuItem('✏️ 编辑内容', () => {
        const newContent = prompt('修改任务内容：', task.content);
        if (newContent && newContent.trim()) TaskModule.updateTask(taskId, { content: newContent.trim() });
      }),
      createMenuItem('📅 迁移日期', () => {
        const newDate = prompt('目标日期 (YYYY-MM-DD)：', DateUtils.today());
        if (newDate && Validate.isValidDate(newDate)) TaskModule.updateTask(taskId, { scheduledDate: newDate });
      }),
      createMenuItem('🗑️ 删除任务', () => TaskModule.deleteTask(taskId), 'text-orange-500'),
    ]);

    document.body.appendChild(menu);
    setTimeout(() => {
      document.addEventListener('click', function closeMenu() {
        DOM.remove(menu);
        document.removeEventListener('click', closeMenu);
      }, { once: true });
    }, 10);
  }, 500);
}, { passive: true });

document.addEventListener('touchend', () => clearTimeout(longPressTimer));
document.addEventListener('touchmove', () => clearTimeout(longPressTimer));

function createMenuItem(label, onClick, extraClass = '') {
  return DOM.create('button', {
    className: `w-full text-left px-4 py-2.5 text-sm text-stone-700 hover:bg-stone-50 transition-all flex items-center gap-2 ${extraClass}`,
    innerHTML: label,
    onClick
  });
}
</script>
